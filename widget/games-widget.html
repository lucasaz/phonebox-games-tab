<!-- PhoneBox Games Tab widget (Custom HTML). Data: push key "game" from the collector; hardware: phonebox.data.state.pc -->
<style>
body{box-sizing:border-box;padding:10px 14px;container-type:size;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
.root{height:100%;display:grid;grid-template-columns:30% 1fr 27%;gap:16px;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#8a94a3}
.acc{color:#a78bfa}
.cover{width:100%;aspect-ratio:460/215;border-radius:10px;overflow:hidden;background:#1b2130;display:grid;place-items:center;flex:none;position:relative}
.cover img.art{width:100%;height:100%;object-fit:cover;display:block}
.cover img.ico{width:56px;height:56px;image-rendering:auto}
.name{font-size:clamp(15px,5.2cqh,22px);font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 7px;border-radius:99px;background:#232a3a;color:#c4cad4;font-weight:600}
.tag.bg{background:#3b2f12;color:#fbbf24}
.timer{font-size:clamp(22px,10cqh,40px);font-weight:700;letter-spacing:.02em;line-height:1}
.sub{font-size:12px;color:#8a94a3}
.sub b{color:#eef2f6;font-weight:600}
.fpsbox{display:flex;align-items:baseline;gap:10px;line-height:.9}
.fps{font-size:clamp(48px,30cqh,120px);font-weight:800;letter-spacing:-.03em}
.fpsu{font-size:clamp(14px,5cqh,20px);color:#8a94a3;font-weight:700}
.good{color:#4ade80}.mid{color:#fbbf24}.bad{color:#f87171}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.k{background:#151a26;border-radius:8px;padding:6px 8px;min-width:0}
.k .v{font-size:clamp(14px,6cqh,22px);font-weight:700;white-space:nowrap}
.k .l{font-size:10px;color:#8a94a3;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.chart{flex:1;min-height:40px;position:relative}
.chart canvas{position:absolute;inset:0;width:100%;height:100%}
.meter{display:grid;grid-template-columns:3.6em 1fr auto;align-items:center;gap:8px;font-size:12.5px}
.meter span:first-child{color:#8a94a3;font-weight:600}
.bar{height:7px;border-radius:9px;background:#232a3a;overflow:hidden}
.bar i{display:block;height:100%;width:calc(var(--v,0)*100%);background:var(--c,#a78bfa);border-radius:9px;transition:width .6s}
.meter b{font-weight:600;white-space:nowrap;min-width:4.6em;text-align:right}
.list{display:flex;flex-direction:column;gap:5px;overflow:hidden;min-height:0}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12.5px;align-items:baseline}
.row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:#8a94a3;white-space:nowrap}
.wk{display:grid;grid-template-columns:minmax(0,1fr) 40% auto;gap:8px;align-items:center;font-size:12.5px}
.wk .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idle{display:grid;place-items:center;text-align:center;flex:1;color:#8a94a3;font-size:13px}
.big{font-size:clamp(26px,13cqh,48px);font-weight:800;color:#eef2f6;line-height:1}
.warn{font-size:11.5px;color:#fbbf24}
.sep{height:1px;background:#232a3a;margin:2px 0}
/* retrato / estreito */
@container (max-width:560px){
  .root{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;gap:10px;overflow:hidden}
  .cover{max-height:22cqh}
  .fps{font-size:clamp(48px,12cqh,96px)}
  .chart{min-height:70px}
  .hideN{display:none}
}
</style>
<div class="root" id="root"><div class="idle" style="grid-column:1/-1">…</div></div>
<script>
var PT = /^pt/i.test(navigator.language || '');
var L = PT ? 'pt-BR' : (navigator.language || 'en-US');
var TX = {
  wait: ['Waiting for the games collector…', 'Aguardando o coletor de jogos…'],
  bg: ['in background', 'em segundo plano'], session: ['Session', 'Sessão'], today: ['Today: ', 'Hoje: '],
  steam: ['Total on Steam: ', 'Total na Steam: '], now: ['Now', 'Agora'], avg: ['avg', 'média'], max: ['max', 'máx'],
  low01: ['0.1% low', '0,1% low'], chart: ['FPS · 2 min', 'FPS · 2 min'], use: ['Load', 'Uso'], temp: ['Temp', 'Temp'],
  power: ['Power', 'Energia'], cpumem: ['CPU and memory', 'CPU e memória'], game: ['Game', 'Jogo'],
  week: ['Last 7 days', 'Últimos 7 dias'], nothing: ['Nothing played yet.', 'Nada jogado ainda.'],
  recent: ['Recent sessions', 'Sessões recentes'], noSess: ['No sessions yet.', 'Nenhuma sessão registrada.'],
  lastSess: ['Last session: ', 'Última sessão: '], avgFps: ['Average ', 'Média '], open: ['Open a game and it shows up here.', 'Abra um jogo e ele aparece aqui.'],
  stale: ['Collector not responding', 'Coletor sem resposta'], none: ['No game running', 'Nenhum jogo aberto'],
  played: ['played today', 'jogados hoje'], noFps: ['FPS unavailable: ', 'FPS indisponível: '],
  todayAt: ['today ', 'hoje '], yest: ['yesterday ', 'ontem ']
};
function T(k) { return TX[k][PT ? 1 : 0]; }
var G = null, S = null, lastKey = '';
var nf1 = new Intl.NumberFormat(L, { maximumFractionDigits: 1 });
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function hms(s) { s = Math.max(0, Math.floor(s)); var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ':' : '') + (h && m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x; }
function hm(s) { s = Math.max(0, Math.round(s / 60)); var h = Math.floor(s / 60), m = s % 60; return h ? h + ' h ' + (m < 10 ? '0' : '') + m : m + ' min'; }
function cls(f) { return f >= 60 ? 'good' : f >= 30 ? 'mid' : 'bad'; }
function ago(ms) {
  var d = new Date(ms), now = new Date(), t = d.toLocaleTimeString(L, { hour: '2-digit', minute: '2-digit' });
  var dd = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  return dd === 0 ? T('todayAt') + t : dd === 1 ? T('yest') + t : d.toLocaleDateString(L, { day: '2-digit', month: '2-digit' });
}
function meter(label, v, max, txt, col) {
  var r = el('div', 'meter'), b = el('span', 'bar'), i = el('i');
  var f = v == null ? 0 : Math.max(0, Math.min(1, v / max));
  i.style.setProperty('--v', f); i.style.setProperty('--c', col || (f > .9 ? '#f87171' : f > .75 ? '#fbbf24' : '#a78bfa'));
  b.append(i); r.append(el('span', null, label), b, el('b', null, v == null ? '—' : txt)); return r;
}
function kpi(v, l, c) { var k = el('div', 'k'); k.append(el('div', 'v' + (c ? ' ' + c : ''), v), el('div', 'l', l)); return k; }
var coverCache = {};
function cover(g) {
  // a capa é reaproveitada entre redesenhos (sem piscar nem baixar de novo)
  var ck = (g.img || '') + '|' + (g.icon || '').length;
  if (coverCache.k === ck) return coverCache.node;
  var c = el('div', 'cover'); coverCache = { k: ck, node: c };
  var ico = function () { if (g.icon) { var i = el('img', 'ico'); i.src = g.icon; c.replaceChildren(i); } else c.replaceChildren(el('div', 'big', '🎮')); };
  if (g.img) { var a = el('img', 'art'); a.src = g.img; a.onerror = ico; c.append(a); } else ico();
  return c;
}
function chart(cv, hist) {
  var w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!w || !h) return; cv.width = w * dpr; cv.height = h * dpr;
  var g = cv.getContext('2d'); g.scale(dpr, dpr);
  var n = 120, max = Math.max(60, Math.max.apply(null, hist.concat([1])) * 1.1);
  // linhas de referência 30 / 60 / 144
  g.font = '10px Roboto, sans-serif'; g.fillStyle = '#5b6472'; g.strokeStyle = '#232a3a'; g.lineWidth = 1;
  [30, 60, 120, 144, 240].forEach(function (r) { if (r > max) return; var y = h - r / max * (h - 4); g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); g.fillText(r, 2, y - 2); });
  if (hist.length < 2) return;
  var x0 = w - (hist.length - 1) / (n - 1) * w;
  var grad = g.createLinearGradient(0, 0, 0, h); grad.addColorStop(0, 'rgba(167,139,250,.35)'); grad.addColorStop(1, 'rgba(167,139,250,0)');
  g.beginPath();
  hist.forEach(function (v, i) { var x = x0 + i / (n - 1) * w, y = h - v / max * (h - 4); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = '#a78bfa'; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
  g.lineTo(w, h); g.lineTo(x0, h); g.closePath(); g.fillStyle = grad; g.fill();
}
function sysCol(d) {
  var c = el('div', 'col'), pc = S && S.pc, gpu = pc && (pc.gpu || (pc.gpus || [])[0]);
  c.append(el('div', 'lbl', 'GPU' + (gpu && gpu.name ? ' · ' + gpu.name.replace(/NVIDIA |GeForce |Laptop GPU/g, '').trim() : '')));
  c.append(meter(T('use'), gpu && gpu.util, 100, gpu && Math.round(gpu.util) + '%'));
  c.append(meter(T('temp'), gpu && gpu.temp, gpu && gpu.tempMax || 95, gpu && Math.round(gpu.temp) + ' °C', gpu && gpu.temp >= 85 ? '#f87171' : gpu && gpu.temp >= 75 ? '#fbbf24' : '#4ade80'));
  c.append(meter('VRAM', gpu && gpu.vramUsed, gpu && gpu.vramTotal || 1, gpu && nf1.format(gpu.vramUsed) + '/' + (gpu.vramTotal || '?') + ' GB'));
  if (gpu && gpu.power != null) c.append(meter(T('power'), gpu.power, gpu.powerLimit || 130, Math.round(gpu.power) + ' W'));
  c.append(el('div', 'sep'));
  c.append(el('div', 'lbl', T('cpumem')));
  c.append(meter('CPU', pc && pc.cpu, 100, pc && Math.round(pc.cpu) + '%'));
  if (d && d.on) c.append(meter(T('game'), d.cpu, 100, Math.round(d.cpu) + '%'));
  c.append(meter('RAM', pc && pc.ramUsedGb, pc && pc.ramTotalGb || 1, pc && nf1.format(pc.ramUsedGb) + '/' + Math.round(pc.ramTotalGb) + ' GB'));
  if (d && d.on && d.ram) c.append(meter(T('game'), d.ram, pc && pc.ramTotalGb || 16, nf1.format(d.ram) + ' GB'));
  return c;
}
function weekList(d, hideTitle) {
  var c = el('div', 'list'), w = d.week || [];
  if (!hideTitle) c.append(el('div', 'lbl', T('week')));
  if (!w.length) c.append(el('div', 'sub', T('nothing')));
  var top = w.length ? w[0].sec : 1;
  w.forEach(function (x) { var r = el('div', 'wk'), b = el('span', 'bar'), i = el('i'); i.style.setProperty('--v', x.sec / top); b.append(i); r.append(el('span', 'n', x.n), b, el('span', 'd', hm(x.sec))); c.append(r); });
  return c;
}
function recentList(d) {
  var c = el('div', 'list'); c.append(el('div', 'lbl', T('recent')));
  var r = d.recent || []; if (!r.length) c.append(el('div', 'sub', T('noSess')));
  r.forEach(function (s) { var row = el('div', 'row'); row.append(el('span', 'n', s.n), el('span', 'd', hm(s.sec) + (s.avg ? ' · ' + s.avg + ' fps' : '') + ' · ' + ago(s.start))); c.append(row); });
  return c;
}
function render(force) {
  var d = G && (G.data || G); var root = document.getElementById('root');
  if (!d) return;
  var stale = d.on && Date.now() - d.t > 15000;
  var key = JSON.stringify([d, S && S.pc, innerWidth, innerHeight]);
  if (key === lastKey && !force) return; lastKey = key;
  root.replaceChildren();
  if (d.on && !stale) {
    var g = d.g;
    var a = el('div', 'col');
    a.append(cover(g), el('div', 'name', g.n));
    var tags = el('div', 'tags'); tags.append(el('span', 'tag', g.store));
    if (d.api) tags.append(el('span', 'tag', d.api));
    if (!d.front) tags.append(el('span', 'tag bg', T('bg')));
    a.append(tags, el('div', 'lbl acc', T('session')), el('div', 'timer', hms(d.sec)));
    var s1 = el('div', 'sub'); s1.append(T('today')); s1.append(el('b', null, hm(d.today))); a.append(s1);
    if (g.steamMin != null) { var s2 = el('div', 'sub hideN'); s2.append(T('steam')); s2.append(el('b', null, hm(g.steamMin * 60 + d.sec))); a.append(s2); }
    var b = el('div', 'col');
    var fb = el('div', 'fpsbox'); fb.append(el('span', 'fps ' + cls(d.fps), d.fps), el('span', 'fpsu', 'FPS'));
    var ftx = el('span', 'sub', d.ft ? nf1.format(d.ft) + ' ms' : ''); ftx.style.marginLeft = 'auto'; fb.append(ftx);
    b.append(el('div', 'lbl', T('now')), fb);
    var k = el('div', 'kpis');
    k.append(kpi(d.low1 || '—', '1% low', d.low1 ? cls(d.low1) : ''), kpi(d.low01 || '—', T('low01'), d.low01 ? cls(d.low01) : ''), kpi(d.avg || '—', T('avg'), d.avg ? cls(d.avg) : ''), kpi(d.max || '—', T('max')));
    b.append(k);
    var ch = el('div', 'chart'), cv = el('canvas'); ch.append(cv); b.append(el('div', 'lbl', T('chart')), ch);
    root.append(a, b, sysCol(d));
    requestAnimationFrame(function () { chart(cv, d.hist || []); });
  } else {
    var l = el('div', 'col');
    l.append(el('div', 'lbl acc', 'Games'));
    if (d.last) {
      l.append(cover({ img: d.last.img, icon: null }), el('div', 'name', d.last.n));
      l.append(el('div', 'sub', T('lastSess') + hm(d.last.sec) + ' · ' + ago(d.last.start)));
      if (d.last.avg) l.append(el('div', 'sub', T('avgFps') + Math.round(d.last.avg) + ' fps · 1% low ' + Math.round(d.last.low1)));
    } else l.append(el('div', 'idle', T('open')));
    var m = el('div', 'col');
    m.append(el('div', 'lbl', stale ? T('stale') : T('none')));
    var bg = el('div', 'big', hm(d.today || 0)); m.append(bg, el('div', 'sub', T('played')));
    if (d.err) m.append(el('div', 'warn', T('noFps') + d.err));
    m.append(el('div', 'sep'), weekList(d), el('div', 'sep'), recentList(d));
    root.append(l, m, sysCol(null));
  }
}
phonebox.on('push', function (all) { if (all && all.game) { G = all.game; render(); } });
phonebox.on('state', function (s) { S = s; render(); });
var w0 = document.querySelector('#root .idle'); if (w0) w0.textContent = T('wait');
addEventListener('resize', function () { render(true); });
setInterval(function () { render(); }, 5000);
</script>
